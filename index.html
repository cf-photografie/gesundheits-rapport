<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rapport">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gesundheits-Rapport</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fffdf7;
    --surface2: #f0ece0;
    --accent: #2d6a4f;
    --accent2: #b7791f;
    --text: #1a1a1a;
    --text2: #5a5a4a;
    --border: #d8d0bc;
    --ok: #2d6a4f;
    --warn: #c05621;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* SYNC STATUS */
  .sync-bar {
    background: var(--accent);
    color: rgba(255,255,255,0.85);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 4px;
    display: none;
  }
  .sync-bar.show { display: block; }
  .sync-bar.error { background: var(--warn); }

  header {
    background: var(--accent);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; }
  header .subtitle { font-size: 0.65rem; opacity: 0.7; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .sync-icon { font-size: 1rem; opacity: 0.8; cursor: default; }
  .sync-icon.syncing { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lang-toggle { display: flex; background: rgba(255,255,255,0.15); border-radius: 20px; overflow: hidden; }
  .lang-btn { padding: 5px 12px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-family: 'DM Mono', monospace; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
  .lang-btn.active { background: rgba(255,255,255,0.25); color: #fff; font-weight: 500; }

  .tabs { display: flex; background: var(--surface2); border-bottom: 2px solid var(--border); }
  .tab { flex: 1; padding: 11px; text-align: center; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; color: var(--text2); transition: all 0.2s; border: none; background: transparent; font-family: 'DM Mono', monospace; }
  .tab.active { color: var(--accent); border-bottom: 3px solid var(--accent); margin-bottom: -2px; font-weight: 500; }

  main { padding: 18px 16px; max-width: 560px; margin: 0 auto; }

  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .section-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .date-row { display: flex; gap: 10px; }
  .date-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 0.85rem; background: var(--bg); color: var(--text); outline: none; transition: border 0.2s; }
  .date-row input:focus { border-color: var(--accent); }

  .scroll-section { display: flex; flex-direction: column; gap: 6px; }
  .scroll-label { font-size: 0.72rem; color: var(--text2); }
  .scroll-wrapper { display: flex; align-items: center; gap: 12px; }
  .scroll-value { font-size: 1.1rem; font-weight: 500; min-width: 68px; text-align: center; color: var(--accent); font-family: 'DM Serif Display', serif; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

  .temp-low { color: #3b82f6; }
  .temp-normal { color: var(--accent); }
  .temp-high { color: var(--warn); }
  .temp-fever { color: #dc2626; }

  .meal-type { display: flex; gap: 8px; margin-bottom: 10px; }
  .meal-type-btn { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-family: 'DM Mono', monospace; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; color: var(--text2); }
  .meal-type-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; background: var(--bg); user-select: none; }
  .check-item:hover { border-color: var(--accent); }
  .check-item.checked { background: #e8f5ef; border-color: var(--ok); }
  .check-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 13px; }
  .check-item.checked .check-box { background: var(--ok); border-color: var(--ok); color: #fff; }
  .check-emoji { font-size: 1.1rem; }
  .check-text { font-size: 0.78rem; line-height: 1.3; }

  textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 0.83rem; background: var(--bg); color: var(--text); resize: vertical; outline: none; transition: border 0.2s; line-height: 1.5; }
  textarea:focus { border-color: var(--accent); }

  input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 0.85rem; background: var(--bg); color: var(--text); outline: none; transition: border 0.2s; }
  input[type="text"]:focus { border-color: var(--accent); }

  .submit-btn { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: 'DM Serif Display', serif; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(45,106,79,0.3); margin-top: 4px; }
  .submit-btn:hover { background: #235c3f; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.83rem; letter-spacing: 0.04em; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error-toast { background: var(--warn); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .history-title { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
  .clear-all-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text2); cursor: pointer; transition: all 0.2s; }
  .clear-all-btn:hover { background: #fee2e2; border-color: #f87171; color: #dc2626; }

  .history-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; }
  .history-date { font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--accent); margin-bottom: 10px; }
  .history-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; letter-spacing: 0.03em; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
  .chip.ok { background: #e8f5ef; border-color: #a3d4b8; color: var(--accent); }
  .chip.warn { background: #fef3e2; border-color: #f6c87a; color: var(--accent2); }
  .history-note { font-size: 0.78rem; color: var(--text2); font-style: italic; line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .delete-btn { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--text2); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .delete-btn:hover { background: #fee2e2; border-color: #f87171; color: #dc2626; }

  .history-empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 0.85rem; line-height: 1.9; }
  .loading-spinner { text-align: center; padding: 30px; color: var(--text2); font-size: 0.8rem; letter-spacing: 0.06em; }
</style>
</head>
<body>

<div class="sync-bar" id="syncBar"></div>

<header>
  <div>
    <h1 id="appTitle">Gesundheits-Rapport</h1>
    <div class="subtitle" id="appSubtitle">Tagesprotokoll</div>
  </div>
  <div class="header-right">
    <span class="sync-icon" id="syncIcon" title="Sync-Status">☁️</span>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('de')">DE</button>
      <button class="lang-btn" onclick="setLang('it')">IT</button>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('form')" id="tabForm">Erfassen</button>
  <button class="tab" onclick="switchTab('history')" id="tabHistory">Verlauf</button>
</div>

<main>
  <!-- FORM TAB -->
  <div class="tab-content active" id="formTab">

    <div class="section-card">
      <div class="section-label" id="labelDateTime">Datum & Zeit</div>
      <div class="date-row">
        <input type="date" id="inputDate">
        <input type="time" id="inputTime">
      </div>
    </div>

    <div class="section-card">
      <div class="section-label" id="labelTemp">Körpertemperatur</div>
      <div class="scroll-section">
        <div class="scroll-wrapper">
          <input type="range" id="tempSlider" min="350" max="420" step="1" value="370" oninput="updateTemp()">
          <div class="scroll-value" id="tempDisplay">37.0°C</div>
        </div>
        <div class="scroll-label" id="tempStatus">Normal</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-label" id="labelMeal">Mahlzeit</div>
      <div class="meal-type">
        <button class="meal-type-btn active" onclick="setMealType('ml')" id="mealMlBtn">ml</button>
        <button class="meal-type-btn" onclick="setMealType('food')" id="mealFoodBtn">Essen</button>
        <button class="meal-type-btn" onclick="setMealType('none')" id="mealNoneBtn">—</button>
      </div>
      <div id="mealMlSection" class="scroll-section">
        <div class="scroll-wrapper">
          <input type="range" id="mlSlider" min="0" max="1000" step="10" value="200" oninput="updateMl()">
          <div class="scroll-value" id="mlDisplay">200 ml</div>
        </div>
      </div>
      <div id="mealFoodSection" style="display:none">
        <input type="text" id="mealFoodInput">
      </div>
    </div>

    <div class="section-card">
      <div class="section-label" id="labelCheckpoints">Checkpunkte</div>
      <div class="check-grid">
        <div class="check-item" onclick="toggleCheck('vitD3')" id="checkVitD3">
          <div class="check-box" id="boxVitD3"></div>
          <div><div class="check-emoji">☀️</div><div class="check-text" id="lblVitD3">Vitamin D3</div></div>
        </div>
        <div class="check-item" onclick="toggleCheck('panda')" id="checkPanda">
          <div class="check-box" id="boxPanda"></div>
          <div><div class="check-emoji">🐼</div><div class="check-text" id="lblPanda">Panda</div></div>
        </div>
        <div class="check-item" onclick="toggleCheck('urin')" id="checkUrin">
          <div class="check-box" id="boxUrin"></div>
          <div><div class="check-emoji">💧</div><div class="check-text" id="lblUrin">Urin</div></div>
        </div>
        <div class="check-item" onclick="toggleCheck('stuhl')" id="checkStuhl">
          <div class="check-box" id="boxStuhl"></div>
          <div><div class="check-emoji">🟤</div><div class="check-text" id="lblStuhl">Stuhl</div></div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-label" id="labelNote">Bemerkung</div>
      <textarea id="noteInput" placeholder="Freitext..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="saveEntry()">Rapport speichern</button>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="historyTab">
    <div class="history-header">
      <div class="history-title" id="historyTitle">Verlauf</div>
      <button class="clear-all-btn" id="clearAllBtn" onclick="clearAll()">Alle löschen</button>
    </div>
    <div id="historyList"><div class="loading-spinner">⏳ Laden...</div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFGv78K2ZNApvjWfHIC2H0dhYaT7x0-_0",
  authDomain: "gesundheits-rapport.firebaseapp.com",
  projectId: "gesundheits-rapport",
  storageBucket: "gesundheits-rapport.firebasestorage.app",
  messagingSenderId: "516805286191",
  appId: "1:516805286191:web:3e3c8d121ea6726095e9da"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "rapporte");

// ─── TRANSLATIONS ─────────────────────────────────────────────────────────
const T = {
  de: {
    appTitle: 'Gesundheits-Rapport', appSubtitle: 'Tagesprotokoll',
    tabForm: 'Erfassen', tabHistory: 'Verlauf',
    labelDateTime: 'Datum & Zeit', labelTemp: 'Körpertemperatur',
    labelMeal: 'Mahlzeit', labelCheckpoints: 'Checkpunkte', labelNote: 'Bemerkung',
    submitBtn: 'Rapport speichern', historyTitle: 'Verlauf', clearAllBtn: 'Alle löschen',
    mealFood: 'Essen', mealNone: '— Keine',
    tempLow: 'Unterkühlt', tempNormal: 'Normal', tempHigh: 'Erhöht', tempFever: 'Fieber',
    lblVitD3: 'Vitamin D3', lblPanda: 'Panda', lblUrin: 'Urin', lblStuhl: 'Stuhl',
    notePlaceholder: 'Freitext...', foodPlaceholder: 'z.B. Suppe, Brei, Joghurt...',
    saved: '✓ Gespeichert & synchronisiert', confirmClear: 'Wirklich alle Einträge löschen?',
    historyEmpty: 'Noch keine Einträge.\nErste Erfassung speichern.',
    noData: '—', syncing: '↑ Synchronisiere...', syncOk: '☁ Synchronisiert',
    syncError: '⚠ Verbindungsfehler', loading: '⏳ Laden...',
    confirmDelete: 'Eintrag löschen?'
  },
  it: {
    appTitle: 'Rapporto Salute', appSubtitle: 'Diario giornaliero',
    tabForm: 'Inserisci', tabHistory: 'Storico',
    labelDateTime: 'Data & Ora', labelTemp: 'Temperatura corporea',
    labelMeal: 'Pasto', labelCheckpoints: 'Punti di controllo', labelNote: 'Osservazione',
    submitBtn: 'Salva rapporto', historyTitle: 'Storico', clearAllBtn: 'Elimina tutto',
    mealFood: 'Cibo', mealNone: '— Nessuno',
    tempLow: 'Ipotermia', tempNormal: 'Normale', tempHigh: 'Elevata', tempFever: 'Febbre',
    lblVitD3: 'Vitamina D3', lblPanda: 'Panda', lblUrin: 'Urina', lblStuhl: 'Feci',
    notePlaceholder: 'Testo libero...', foodPlaceholder: 'es. zuppa, yogurt...',
    saved: '✓ Salvato e sincronizzato', confirmClear: 'Eliminare tutti i record?',
    historyEmpty: 'Nessun dato ancora.\nInserisci il primo rapporto.',
    noData: '—', syncing: '↑ Sincronizzazione...', syncOk: '☁ Sincronizzato',
    syncError: '⚠ Errore connessione', loading: '⏳ Caricamento...',
    confirmDelete: 'Eliminare questo record?'
  }
};

let lang = 'de';
let mealType = 'ml';
const checks = { vitD3: false, panda: false, urin: false, stuhl: false };
let unsubscribe = null;

// ─── LANGUAGE ───────────────────────────────────────────────────────────────
window.setLang = (l) => {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  applyTranslations();
};

function applyTranslations() {
  const t = T[lang];
  document.getElementById('appTitle').textContent = t.appTitle;
  document.getElementById('appSubtitle').textContent = t.appSubtitle;
  document.getElementById('tabForm').textContent = t.tabForm;
  document.getElementById('tabHistory').textContent = t.tabHistory;
  document.getElementById('labelDateTime').textContent = t.labelDateTime;
  document.getElementById('labelTemp').textContent = t.labelTemp;
  document.getElementById('labelMeal').textContent = t.labelMeal;
  document.getElementById('labelCheckpoints').textContent = t.labelCheckpoints;
  document.getElementById('labelNote').textContent = t.labelNote;
  document.getElementById('submitBtn').textContent = t.submitBtn;
  document.getElementById('historyTitle').textContent = t.historyTitle;
  document.getElementById('clearAllBtn').textContent = t.clearAllBtn;
  document.getElementById('mealFoodBtn').textContent = t.mealFood;
  document.getElementById('mealNoneBtn').textContent = t.mealNone;
  document.getElementById('lblVitD3').textContent = t.lblVitD3;
  document.getElementById('lblPanda').textContent = t.lblPanda;
  document.getElementById('lblUrin').textContent = t.lblUrin;
  document.getElementById('lblStuhl').textContent = t.lblStuhl;
  document.getElementById('noteInput').placeholder = t.notePlaceholder;
  document.getElementById('mealFoodInput').placeholder = t.foodPlaceholder;
  updateTemp();
}

// ─── TABS ────────────────────────────────────────────────────────────────────
window.switchTab = (tab) => {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tab + 'Tab').classList.add('active');
  document.getElementById(tab === 'form' ? 'tabForm' : 'tabHistory').classList.add('active');
  if (tab === 'history') subscribeHistory();
};

// ─── TEMPERATURE ─────────────────────────────────────────────────────────────
window.updateTemp = () => {
  const val = parseInt(document.getElementById('tempSlider').value);
  const temp = (val / 10).toFixed(1);
  const t = T[lang];
  let cls = 'temp-normal', txt = t.tempNormal;
  if (val < 360) { cls = 'temp-low'; txt = t.tempLow; }
  else if (val >= 375 && val < 383) { cls = 'temp-high'; txt = t.tempHigh; }
  else if (val >= 383) { cls = 'temp-fever'; txt = t.tempFever; }
  document.getElementById('tempDisplay').textContent = temp + '°C';
  document.getElementById('tempDisplay').className = 'scroll-value ' + cls;
  document.getElementById('tempStatus').textContent = txt;
  document.getElementById('tempStatus').className = 'scroll-label ' + cls;
};

// ─── MEAL ─────────────────────────────────────────────────────────────────────
window.setMealType = (type) => {
  mealType = type;
  document.querySelectorAll('.meal-type-btn').forEach(b => b.classList.remove('active'));
  const map = { ml: 'mealMlBtn', food: 'mealFoodBtn', none: 'mealNoneBtn' };
  document.getElementById(map[type]).classList.add('active');
  document.getElementById('mealMlSection').style.display = type === 'ml' ? '' : 'none';
  document.getElementById('mealFoodSection').style.display = type === 'food' ? '' : 'none';
};

window.updateMl = () => {
  document.getElementById('mlDisplay').textContent = document.getElementById('mlSlider').value + ' ml';
};

// ─── CHECKBOXES ───────────────────────────────────────────────────────────────
window.toggleCheck = (id) => {
  checks[id] = !checks[id];
  const key = id.charAt(0).toUpperCase() + id.slice(1);
  document.getElementById('check' + key).classList.toggle('checked', checks[id]);
  document.getElementById('box' + key).textContent = checks[id] ? '✓' : '';
};

// ─── SAVE TO FIRESTORE ────────────────────────────────────────────────────────
window.saveEntry = async () => {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setSyncStatus('syncing');

  let meal = '';
  if (mealType === 'ml') meal = document.getElementById('mlSlider').value + ' ml';
  else if (mealType === 'food') meal = document.getElementById('mealFoodInput').value || T[lang].mealFood;
  else meal = T[lang].noData;

  const entry = {
    date: document.getElementById('inputDate').value,
    time: document.getElementById('inputTime').value,
    temp: (parseInt(document.getElementById('tempSlider').value) / 10).toFixed(1),
    meal,
    vitD3: checks.vitD3,
    panda: checks.panda,
    urin: checks.urin,
    stuhl: checks.stuhl,
    note: document.getElementById('noteInput').value,
    lang,
    createdAt: new Date().toISOString()
  };

  try {
    await addDoc(colRef, entry);
    setSyncStatus('ok');
    showToast(T[lang].saved);
    resetForm();
  } catch(e) {
    console.error(e);
    setSyncStatus('error');
    showToast('⚠ ' + T[lang].syncError, true);
  }
  btn.disabled = false;
};

// ─── REALTIME HISTORY ─────────────────────────────────────────────────────────
function subscribeHistory() {
  if (unsubscribe) unsubscribe();
  document.getElementById('historyList').innerHTML = `<div class="loading-spinner">${T[lang].loading}</div>`;
  const q = query(colRef, orderBy('createdAt', 'desc'));
  unsubscribe = onSnapshot(q, (snapshot) => {
    renderHistory(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
  }, (err) => {
    console.error(err);
    setSyncStatus('error');
  });
}

function renderHistory(entries) {
  const container = document.getElementById('historyList');
  if (!entries.length) {
    container.innerHTML = `<div class="history-empty">${T[lang].historyEmpty.replace('\n','<br>')}</div>`;
    return;
  }
  container.innerHTML = entries.map(e => {
    const l = T[e.lang] || T['de'];
    const chips = [
      e.vitD3 ? `<span class="chip ok">☀️ ${l.lblVitD3}</span>` : '',
      e.panda ? `<span class="chip ok">🐼 ${l.lblPanda}</span>` : '',
      e.urin  ? `<span class="chip ok">💧 ${l.lblUrin}</span>`  : '',
      e.stuhl ? `<span class="chip ok">🟤 ${l.lblStuhl}</span>` : ''
    ].filter(Boolean).join('');
    const tempVal = parseFloat(e.temp);
    const tempClass = (tempVal < 36.0 || tempVal >= 38.3) ? 'warn' : 'ok';
    return `
    <div class="history-entry">
      <button class="delete-btn" onclick="deleteEntry('${e.id}')">✕</button>
      <div class="history-date">📅 ${e.date} · ${e.time}</div>
      <div class="history-chips">
        <span class="chip ${tempClass}">🌡 ${e.temp}°C</span>
        ${e.meal && e.meal !== '—' ? `<span class="chip">🍽 ${e.meal}</span>` : ''}
        ${chips}
      </div>
      ${e.note ? `<div class="history-note">💬 ${e.note}</div>` : ''}
    </div>`;
  }).join('');
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
window.deleteEntry = async (id) => {
  if (!confirm(T[lang].confirmDelete)) return;
  try {
    await deleteDoc(doc(db, 'rapporte', id));
  } catch(e) { showToast('⚠ Fehler', true); }
};

window.clearAll = async () => {
  if (!confirm(T[lang].confirmClear)) return;
  try {
    const snap = await getDocs(colRef);
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
  } catch(e) { showToast('⚠ Fehler', true); }
};

// ─── SYNC STATUS ──────────────────────────────────────────────────────────────
function setSyncStatus(status) {
  const icon = document.getElementById('syncIcon');
  if (status === 'syncing') { icon.textContent = '🔄'; icon.classList.add('syncing'); }
  else if (status === 'ok') { icon.textContent = '☁️'; icon.classList.remove('syncing'); }
  else { icon.textContent = '⚠️'; icon.classList.remove('syncing'); }
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
window.showToast = (msg, isError = false) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error-toast' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
};

// ─── RESET / INIT ─────────────────────────────────────────────────────────────
function resetForm() {
  initDateTime();
  document.getElementById('tempSlider').value = 370;
  updateTemp();
  document.getElementById('mlSlider').value = 200;
  updateMl();
  setMealType('ml');
  document.getElementById('mealFoodInput').value = '';
  document.getElementById('noteInput').value = '';
  ['vitD3','panda','urin','stuhl'].forEach(id => {
    checks[id] = false;
    const key = id.charAt(0).toUpperCase() + id.slice(1);
    document.getElementById('check' + key).classList.remove('checked');
    document.getElementById('box' + key).textContent = '';
  });
}

function initDateTime() {
  const now = new Date();
  document.getElementById('inputDate').value = now.toISOString().split('T')[0];
  document.getElementById('inputTime').value =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

initDateTime();
updateTemp();
updateMl();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>
